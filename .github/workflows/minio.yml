name: minio

on:
  workflow_dispatch:
env:
  RELEASE_VERSION: RELEASE.2025-06-13T11-33-47Z
  NEW_TAG: latest,RELEASE.2025-06-13T11-33-47Z,20250613
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker 
        uses: docker/login-action@v3.4.0
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD  }}

      - name: Pull original image
        run: docker pull quay.io/minio/minio:${{ env.RELEASE_VERSION }}

      - name: Tag image
        run: |
          IFS=',' read -ra TAGS <<< "${{ env.NEW_TAG }}"
          for tag in "${TAGS[@]}"; do
            docker tag quay.io/minio/minio:${{ env.RELEASE_VERSION }} registry.cn-hangzhou.aliyuncs.com/docker-public-hub/minio:${tag}
          done
      - name: Push image
        run: |
          IFS=',' read -ra TAGS <<< "${NEW_TAG}"
          for tag in "${TAGS[@]}"; do
            docker push registry.cn-hangzhou.aliyuncs.com/docker-public-hub/minio:${tag}
          done
